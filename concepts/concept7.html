<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 7. Graphite</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2c2d31;--bg2:#232427;--bg3:#36373c;--wh:#f2f0ea;--mid:#b9b6ae;--dim:#86837b;--acc:#d6b35a;--line:#44454a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--wh);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 96px}
.demo{background:var(--acc);color:#1d1d1d;font-family:Oswald;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:6px}
header{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end;border-bottom:3px solid var(--wh);padding-bottom:12px}
header .yr{font-family:Oswald;font-weight:700;font-size:13px;letter-spacing:.14em;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--acc);border-left:2px solid var(--acc);padding-left:8px}
header h1{font-family:Oswald;font-weight:700;font-size:clamp(50px,15vw,100px);line-height:.88;margin:0;text-transform:uppercase;letter-spacing:-.01em}
header .sub{font-family:Oswald;font-weight:500;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 0;gap:1px;background:var(--line)}
.stat{background:var(--bg);padding:12px 6px 10px;text-align:center}
.stat b{display:block;font-family:Oswald;font-weight:600;font-size:38px;line-height:1}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
.h2{font-family:Oswald;font-weight:600;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--acc);margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.one{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;background:var(--bg2);border-left:6px solid var(--acc);padding:16px 16px 14px;margin-bottom:6px}
.one .t{font-family:Oswald;font-weight:700;font-size:clamp(34px,10vw,64px);line-height:.92;text-transform:uppercase;grid-column:1/3}
.one .a{font-size:13px;color:var(--mid)}
.one .n{font-family:Oswald;font-weight:600;font-size:28px;color:var(--acc);text-align:right;line-height:1}
.one .n small{display:block;font-family:Inter;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.one .tags{grid-column:1/3}
.tag{display:inline-block;font-family:Oswald;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;margin:4px 4px 0 0;border:1px solid var(--mid);color:var(--mid)}
.tag.bust{border-color:var(--acc);color:var(--acc)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:44px 1fr auto;gap:0 10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.lb .rk{grid-area:1/1/3/2;font-family:Oswald;font-weight:600;font-size:30px;color:var(--mid);font-variant-numeric:tabular-nums}
.lb .t{grid-area:1/2/2/3;font-family:Oswald;font-weight:500;font-size:23px;line-height:1.05;text-transform:uppercase}
.lb .a{grid-area:2/2/3/3;font-size:12.5px;color:var(--mid);margin-top:3px}
.lb .c{grid-area:1/3/3/4;font-family:Oswald;font-weight:600;font-size:26px;text-align:right;line-height:1}
.lb .c small{display:block;font-family:Inter;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.lb .bar{grid-area:3/2/4/4;height:8px;background:var(--bg2);margin-top:8px}
.lb .bar i{display:block;height:100%;background:var(--acc)}
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.alb .nm{font-family:Oswald;font-weight:500;font-size:19px;text-transform:uppercase}
.alb .nm i{font-style:normal;font-family:Inter;font-size:12px;color:var(--mid);margin-left:6px;text-transform:none}
.alb .ct{font-family:Oswald;font-weight:600;font-size:17px;color:var(--acc)}
.alb .tr{grid-column:1/3;height:8px;background:var(--bg2);margin-top:6px}
.alb .tr i{display:block;height:100%;background:var(--wh)}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);background:var(--bg2);color:var(--wh);font-size:16px;font-family:inherit;margin:0 0 10px;border-radius:0}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--acc)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-family:Oswald;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.sortbar{display:flex;border:1px solid var(--line)}
.sortbar button{border:0;background:none;color:var(--mid);padding:7px 12px;font-family:Oswald;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.sortbar button.on{background:var(--wh);color:#1d1d1d}
.artist{margin-top:24px;border-left:3px solid var(--acc);padding-left:12px}
.artist .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.artist .hd b{font-family:Oswald;font-weight:600;font-size:26px;line-height:1;text-transform:uppercase}
.artist .hd small{display:block;font-family:Inter;font-size:12px;color:var(--acc);margin-top:4px;text-transform:none;font-weight:400}
.artist .hd .m{font-family:Oswald;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);white-space:nowrap;text-align:right;line-height:1.3}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.song .t{font-size:16px;font-weight:500;line-height:1.25}
.song .t .n{display:block;font-size:12px;color:var(--mid);font-weight:400}
.song .life{font-family:Oswald;font-weight:600;font-size:22px;min-width:36px;text-align:right}
.song .life.rare{font-family:Inter;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.song .tour{min-width:30px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-family:Oswald;font-weight:600;font-size:15px;border:1px solid var(--line);color:var(--dim)}
.song .tour.hot{background:var(--acc);border-color:var(--acc);color:#1d1d1d}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--mid);padding:14px 2px;font-family:Oswald;font-weight:500;font-size:15px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--wh);border-bottom-color:var(--acc)}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--mid);padding:30px 0;font-family:Oswald;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header>
  <div class="yr">Fall 2026</div>
  <div><h1>Burn the Setlist</h1><p class="sub">Brandi Carlile · All Request Tour</p></div>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>different songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing to rank yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0], max=one.c;
    h+=`<div class="h2">No. 1 most requested</div><div class="one"><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n">${one.c} of ${M.done}<small>nights</small></div><div class="tags">${tags(one.tags)}</div></div>
    <div class="h2">The chart</div><ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${String(r.rank).padStart(2,'0')}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div><div class="bar"><i style="width:${Math.round(r.c/max*100)}%"></i></div></li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit} of ${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="hd"><div><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}</div><div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?`<br>${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
})();
</script>
</body>
</html>
