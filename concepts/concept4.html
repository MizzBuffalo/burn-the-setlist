<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 4. Ticket Stub</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1b1e;--bg2:#242428;--blue:#3b6cff;--coral:#ff6b57;--cream:#f3ecd9;--dim:#8c8a82;--line:#36363c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 100px}
.demo{background:var(--coral);color:#000;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:6px;font-weight:600}
.big{font-family:'Big Shoulders Display',sans-serif;font-weight:900}
/* ticket header */
.tix{display:grid;grid-template-columns:54px 1fr;background:var(--blue);color:var(--cream);position:relative;border-radius:6px;overflow:hidden}
.tix .stub{border-right:2px dashed rgba(243,236,217,.6);display:flex;align-items:center;justify-content:center}
.tix .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Big Shoulders Display';font-weight:900;font-size:22px;letter-spacing:.2em;text-transform:uppercase}
.tix .main{padding:16px 14px 14px}
.tix .ev{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.tix h1{font-family:'Big Shoulders Display';font-weight:900;font-size:clamp(50px,15vw,100px);line-height:.85;margin:6px 0 10px;text-transform:uppercase;letter-spacing:-.01em}
.tix .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid rgba(243,236,217,.4);padding-top:8px}
.tix .grid div{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.tix .grid b{display:block;font-family:'Big Shoulders Display';font-weight:900;font-size:22px;letter-spacing:.04em;opacity:1}
.tix::before,.tix::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--bg);left:45px}
.tix::before{top:-9px}.tix::after{bottom:-9px}
.stats{display:flex;gap:8px;margin:14px 0 4px}
.stat{flex:1;background:var(--bg2);padding:10px 8px;border-top:3px solid var(--blue)}
.stat b{display:block;font-family:'Big Shoulders Display';font-weight:900;font-size:40px;line-height:1}
.stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.h2{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--coral);margin:26px 0 10px;padding-bottom:6px;border-bottom:2px dashed var(--line)}
/* sold out */
.one{position:relative;background:var(--bg2);border:2px solid var(--cream);padding:18px 16px 16px;margin:0 0 18px;overflow:hidden}
.one .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.one .t{font-family:'Big Shoulders Display';font-weight:900;font-size:clamp(40px,12vw,76px);line-height:.88;text-transform:uppercase;margin:6px 0 4px}
.one .a{font-size:12px;color:var(--dim)}
.one .n{font-family:'Big Shoulders Display';font-weight:900;font-size:30px;margin-top:10px;color:var(--blue)}
.one .stamp{position:absolute;right:8px;bottom:14px;transform:rotate(-8deg);font-family:'Big Shoulders Display';font-weight:900;font-size:24px;letter-spacing:.1em;color:var(--coral);border:4px solid var(--coral);padding:2px 12px;text-transform:uppercase;opacity:.9;background:rgba(27,27,30,.6)}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;margin:5px 4px 0 0;border:1.5px solid var(--blue);color:var(--blue)}
.tag.bust{border-color:var(--coral);color:var(--coral)}
/* receipt list */
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:40px 1fr auto;gap:0 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lb .rk{font-size:15px;font-weight:600;color:var(--coral);grid-area:1/1/3/2;}
.lb .t{grid-area:1/2/2/3;font-family:'Big Shoulders Display';font-weight:700;font-size:25px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.lb .a{grid-area:2/2/3/3;font-size:11px;color:var(--dim);margin-top:3px}
.lb .c{font-family:'Big Shoulders Display';font-weight:900;font-size:30px;grid-area:1/3/3/4;text-align:right;line-height:1}
.lb .c small{display:block;font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.lb .bar{grid-area:3/2/4/4;height:7px;margin-top:6px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 18px)}
.lb .bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--blue) 0 14px,transparent 14px 18px)}
/* scorecard */
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.alb .nm{font-family:'Big Shoulders Display';font-weight:700;font-size:20px;text-transform:uppercase}
.alb .nm i{font-style:normal;font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);margin-left:6px}
.alb .ct{font-size:13px;font-weight:600;color:var(--coral)}
.alb .tr{grid-column:1/3;height:7px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 18px);margin-top:5px}
.alb .tr i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--coral) 0 14px,transparent 14px 18px)}
/* covers */
.search{width:100%;padding:12px 14px;border:2px solid var(--line);background:#121214;color:var(--cream);font-size:15px;font-family:'IBM Plex Mono';margin:0 0 10px;border-radius:0}
.search:focus{outline:none;border-color:var(--blue)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sortbar{display:flex;gap:6px}
.sortbar button{border:1.5px solid var(--line);background:none;color:var(--dim);padding:6px 10px;font-family:'IBM Plex Mono';font-weight:600;font-size:11px;text-transform:uppercase;cursor:pointer}
.sortbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.artist{margin-top:22px}
.stubhd{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;background:var(--bg2);padding:10px 12px;border-left:6px solid var(--coral);position:relative}
.stubhd b{font-family:'Big Shoulders Display';font-weight:900;font-size:28px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.stubhd small{display:block;font-size:11px;color:var(--coral);margin-top:4px}
.stubhd .seat{display:flex;gap:10px;text-align:center}
.stubhd .seat div{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stubhd .seat div b{display:block;font-size:22px;color:var(--cream);margin-top:1px}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 12px;align-items:center;padding:9px 0 9px 12px;border-bottom:1px dashed var(--line)}
.song .t{font-size:15px;font-weight:600;line-height:1.25;font-family:'IBM Plex Mono'}
.song .t .n{display:block;font-size:11px;color:var(--dim);font-weight:400}
.song .life{font-family:'Big Shoulders Display';font-weight:900;font-size:24px;min-width:40px;text-align:right}
.song .life.rare{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#55544e}
.song .tour{min-width:32px;height:26px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:#55544e}
.song .tour.hot{background:var(--blue);border-color:var(--blue);color:#fff}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#0f0f11;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.tabs{display:flex;gap:4px;max-width:720px;margin:0 auto}
.tab{flex:1;background:var(--bg2);border:0;color:var(--dim);padding:11px 2px;font-family:'Big Shoulders Display';font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 60%,5px 50%,0 40%)}
.tab.on{background:var(--blue);color:#fff}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--dim);padding:30px 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header class="tix">
  <div class="stub"><span>Admit one</span></div>
  <div class="main">
    <div class="ev">Brandi Carlile presents</div>
    <h1>Burn the Setlist</h1>
    <div class="grid"><div>Sec<b>All Req</b></div><div>Row<b>Fall</b></div><div>Seat<b>2026</b></div></div>
  </div>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
const code=a=>a.replace(/^the /i,'').split(/\s+/).map(w=>w[0]).join('').replace(/[^a-z0-9]/gi,'').slice(0,3).toUpperCase();
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>diff. songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing on the board yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0], max=one.c;
    h+=`<div class="h2">No. 1 most requested</div><div class="one"><div class="stamp">Sold out</div><div class="k">Seat 01</div><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n">${one.c} of ${M.done} nights</div><div>${tags(one.tags)}</div></div>
    <div class="h2">The chart</div><ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${String(r.rank).padStart(2,'0')}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div><div class="bar"><i style="width:${Math.round(r.c/max*100)}%"></i></div></li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit}/${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c?'x'+s.c:'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="stubhd"><div><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}</div><div class="seat"><div>Sec<b>${esc(code(g.artist))}</b></div><div>Songs<b>${g.songs.length}</b></div><div>Plays<b>${g.tot||'·'}</b></div></div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
const h=location.hash.slice(1); if(h&&document.getElementById(h)) show(h);
})();
</script>
</body>
</html>
