<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 3. Woodtype</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Alfa+Slab+One&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#15110e;--ink2:#201a15;--cream:#efe3c4;--red:#d8372a;--dim:#8d826c;--line:#33291f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--cream);font-family:Oswald,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(rgba(239,227,196,.06) 1px,transparent 1px);background-size:4px 4px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 100px}
.demo{background:var(--red);color:var(--cream);font-family:Oswald;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:6px}
/* bill header */
.bill{border:3px double var(--cream);padding:16px 10px 14px;margin-top:14px;text-align:center;position:relative}
.bill::before,.bill::after{content:"✦";position:absolute;top:8px;color:var(--red);font-size:16px}
.bill::before{left:10px}.bill::after{right:10px}
.rule{display:flex;align-items:center;gap:8px;color:var(--red);font-family:Oswald;font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin:4px 0}
.rule::before,.rule::after{content:"";flex:1;height:2px;background:var(--cream)}
.bill .who{font-family:'Alfa Slab One';font-size:clamp(22px,7vw,36px);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 2px}
.bill h1{font-family:Rye,serif;font-size:clamp(44px,13.5vw,96px);line-height:.92;margin:6px 0 8px;color:var(--cream);text-shadow:3px 3px 0 var(--red)}
.bill .what{font-family:Oswald;font-weight:600;font-size:15px;letter-spacing:.26em;text-transform:uppercase;background:var(--cream);color:var(--ink);display:inline-block;padding:4px 14px;margin-top:4px}
.stats{display:flex;margin:14px 0 0;border:2px solid var(--cream)}
.stat{flex:1;text-align:center;padding:10px 4px;border-right:2px solid var(--cream)}
.stat:last-child{border:0}
.stat b{display:block;font-family:'Alfa Slab One';font-size:36px;line-height:1;color:var(--cream)}
.stat span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.h2{font-family:Oswald;font-weight:600;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--red);text-align:center;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.h2::before,.h2::after{content:"";flex:1;height:1px;background:var(--line)}
/* top of the bill */
.one{background:var(--red);color:var(--cream);text-align:center;padding:16px 12px 14px;border:3px solid var(--cream);outline:3px solid var(--red);margin:4px 3px 24px;position:relative}
.one .k{font-family:Oswald;font-weight:600;font-size:12px;letter-spacing:.34em;text-transform:uppercase}
.one .t{font-family:'Alfa Slab One';font-size:clamp(34px,10.5vw,70px);line-height:.95;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.01em;text-shadow:2px 2px 0 var(--ink)}
.one .a{font-size:14px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.one .n{font-family:'Alfa Slab One';font-size:24px;margin-top:10px;background:var(--cream);color:var(--red);display:inline-block;padding:2px 14px}
.tag{display:inline-block;font-family:Oswald;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;margin:5px 3px 0 0;border:1.5px solid currentColor;color:var(--red)}
.tag.bust{color:var(--cream);background:var(--red);border-color:var(--red)}
.one .tag{color:var(--cream);border-color:var(--cream)}
.one .tag.bust{background:var(--ink);border-color:var(--ink)}
/* also appearing */
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:44px 1fr auto;gap:0 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lb .rk{font-family:'Alfa Slab One';font-size:30px;color:var(--red);grid-area:1/1/3/2;text-align:center}
.lb .t{grid-area:1/2/2/3;font-family:'Alfa Slab One';font-size:19px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.lb .a{grid-area:2/2/3/3;font-size:12.5px;color:var(--dim);letter-spacing:.04em;margin-top:3px}
.lb .c{font-family:'Alfa Slab One';font-size:24px;grid-area:1/3/3/4;text-align:right}
.lb .c small{display:block;font-family:Oswald;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.lb .bar{grid-area:3/2/4/4;height:5px;background:var(--line);margin-top:6px}
.lb .bar i{display:block;height:100%;background:var(--red)}
/* scorecard */
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.alb .nm{font-family:'Alfa Slab One';font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.alb .nm i{font-style:normal;font-family:Oswald;font-size:12px;color:var(--dim);margin-left:6px}
.alb .ct{font-family:'Alfa Slab One';font-size:16px;color:var(--red)}
.alb .tr{grid-column:1/3;height:5px;background:var(--line);margin-top:5px}
.alb .tr i{display:block;height:100%;background:var(--cream)}
/* covers */
.search{width:100%;padding:12px 14px;border:2px solid var(--cream);background:var(--ink2);color:var(--cream);font-size:17px;font-family:Oswald;margin:14px 0 10px;border-radius:0}
.search:focus{outline:none;border-color:var(--red)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.sortbar{display:flex;border:1.5px solid var(--cream)}
.sortbar button{border:0;background:none;color:var(--cream);padding:6px 12px;font-family:Oswald;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.sortbar button.on{background:var(--cream);color:var(--ink)}
.artist{margin-top:26px}
.band{text-align:center;position:relative;padding:8px 0 6px;border-top:2px solid var(--cream);border-bottom:2px solid var(--cream)}
.band b{display:block;font-family:'Alfa Slab One';font-weight:400;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.band small{display:block;font-size:12px;color:var(--red);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.band .m{font-size:12px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase;margin-top:4px}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 12px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.song .t{font-size:17px;font-weight:500;line-height:1.2}
.song .t .n{display:block;font-size:12px;color:var(--dim);font-weight:400}
.song .life{font-family:'Alfa Slab One';font-size:19px;min-width:40px;text-align:right}
.song .life.rare{font-family:Oswald;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#5d5346}
.song .tour{min-width:30px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-family:'Alfa Slab One';font-size:14px;border:1.5px solid var(--line);color:#5d5346}
.song .tour.hot{background:var(--red);border-color:var(--red);color:var(--cream)}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--cream);padding-bottom:env(safe-area-inset-bottom);border-top:3px solid var(--red)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;border-right:1px solid #cdbf9c;color:var(--ink);padding:13px 2px;font-family:Oswald;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab:last-child{border:0}
.tab.on{background:var(--red);color:var(--cream)}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--dim);padding:30px 0;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header class="bill">
  <div class="rule">Fall 2026</div>
  <div class="who">Brandi Carlile</div>
  <h1>Burn the Setlist</h1>
  <div class="what">All Request Tour</div>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>different songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing on the bill yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0], max=one.c;
    h+=`<div class="h2">Top of the bill</div><div class="one"><div class="k">Most requested</div><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n">${one.c} of ${M.done} nights</div><div>${tags(one.tags)}</div></div>
    <div class="h2">Also appearing</div><ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${r.rank}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div><div class="bar"><i style="width:${Math.round(r.c/max*100)}%"></i></div></li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit} of ${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="band"><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}<div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?` ✦ ${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
const h=location.hash.slice(1); if(h&&document.getElementById(h)) show(h);
})();
</script>
</body>
</html>
