<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 5. Stage Floor</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--floor:#0c0c0c;--tape:#e8e3d3;--paper:#f3efe4;--ink:#141414;--red:#e0282e;--wh:#f5f2ea;--dim:#8a877d;--line:#2a2a2a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--floor);color:var(--wh);font-family:'Patrick Hand',cursive;-webkit-font-smoothing:antialiased}
body{background-image:repeating-linear-gradient(90deg,transparent 0 110px,rgba(255,255,255,.045) 110px 112px)}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 100px}
.demo{background:var(--red);color:#fff;font-family:'Permanent Marker';font-size:13px;text-align:center;padding:6px}
.mk{font-family:'Permanent Marker',cursive}
/* tape */
.tape{background:var(--tape);color:var(--ink);padding:8px 14px;display:inline-block;box-shadow:0 2px 4px rgba(0,0,0,.6);clip-path:polygon(1% 0,99% 2%,100% 100%,0 98%);transform:rotate(-1.5deg)}
.tape.l{transform:rotate(1.2deg)}
header{text-align:center;margin-bottom:8px}
header .t1{font-family:'Permanent Marker';font-size:clamp(42px,12.5vw,90px);line-height:.95;padding:8px 18px 12px;transform:rotate(-2deg)}
header .t2{font-family:'Permanent Marker';font-size:16px;letter-spacing:.04em;margin-top:10px;transform:rotate(1.5deg)}
.stats{display:flex;justify-content:space-around;margin:20px 0 4px}
.stat{text-align:center}
.stat b{display:block;font-family:'Permanent Marker';font-size:42px;line-height:1;color:var(--wh)}
.stat span{font-size:16px;color:var(--dim)}
.h2{font-family:'Permanent Marker';font-size:20px;color:var(--wh);margin:26px 0 10px;display:flex;align-items:center;gap:12px}
.h2::after{content:"";flex:1;border-top:3px solid var(--red);border-radius:50%;height:4px;transform:rotate(-.4deg)}
/* the sheet */
.sheet{background:var(--paper);color:var(--ink);padding:22px 16px 18px;position:relative;margin:14px 4px 0;box-shadow:0 6px 14px rgba(0,0,0,.7);transform:rotate(.4deg)}
.sheet::before,.sheet::after{content:"";position:absolute;top:-10px;width:70px;height:22px;background:rgba(232,227,211,.85);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.sheet::before{left:14px;transform:rotate(-6deg)}.sheet::after{right:14px;transform:rotate(5deg)}
.sheet .hd{font-family:'Permanent Marker';font-size:14px;letter-spacing:.06em;color:#555;border-bottom:2px solid #222;padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between}
.one{position:relative;padding:12px 10px 10px 8px;margin:4px 0 10px}
.one::before{content:"";position:absolute;inset:-4px 0 -2px -4px;border:4px solid var(--red);border-radius:48% 52% 45% 55%/58% 42% 58% 42%;transform:rotate(-1.5deg);pointer-events:none}
.one .t{font-family:'Permanent Marker';font-size:clamp(28px,8.8vw,56px);line-height:1;letter-spacing:-.01em}
.one .a{font-size:17px;color:#444;margin-top:4px}
.one .win{position:absolute;right:6px;top:-18px;font-family:'Permanent Marker';color:var(--red);font-size:22px;transform:rotate(-8deg)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:34px 1fr auto;gap:0 8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.08)}
.lb .rk{grid-area:1/1/2/2;font-family:'Permanent Marker';font-size:22px;color:#333}
.lb .t{grid-area:1/2/2/3;font-family:'Permanent Marker';font-size:21px;line-height:1.05}
.lb .a{font-size:15px;color:#666;grid-area:2/2/3/3}
.tally{display:inline-flex;gap:3px;align-items:flex-end;grid-area:1/3/3/4;justify-self:end;padding:4px 0 0 4px}
.tally .g{position:relative;display:inline-flex;gap:3px;margin-right:6px}
.tally i{display:block;width:3px;height:22px;background:var(--red);border-radius:2px;transform:rotate(3deg)}
.tally .g i:nth-child(2){transform:rotate(-2deg)}
.tally .g.five::after{content:"";position:absolute;left:-3px;right:-3px;top:10px;height:3px;background:var(--red);transform:rotate(-22deg);border-radius:2px}
.tag{display:inline-block;font-family:'Permanent Marker';font-size:12px;color:var(--red);margin-left:6px;transform:rotate(-2deg)}
.tag.streak{color:#1b6ad6}
/* scorecard as tape strips */
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;margin:12px 0}
.alb .nm{font-family:'Permanent Marker';font-size:17px;background:var(--tape);color:var(--ink);padding:5px 10px;display:inline-block;justify-self:start;clip-path:polygon(0 4%,100% 0,99% 100%,1% 96%);transform:rotate(-.8deg)}
.alb .nm i{font-style:normal;font-family:'Patrick Hand';font-size:14px;color:#666;margin-left:6px}
.alb .ct{font-family:'Permanent Marker';font-size:20px;color:var(--wh)}
.alb .tr{grid-column:1/3;height:6px;margin-top:6px;background:var(--line);border-radius:3px}
.alb .tr i{display:block;height:100%;background:var(--red);border-radius:3px;transform:skewX(-8deg)}
/* covers */
.search{width:100%;padding:12px 14px;border:2px solid #444;background:#151515;color:var(--wh);font-size:19px;font-family:'Patrick Hand';margin:0 0 10px;border-radius:0}
.search:focus{outline:none;border-color:var(--tape)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:16px;color:var(--dim)}
.sortbar{display:flex;gap:10px}
.sortbar button{border:0;background:none;color:var(--dim);padding:4px 2px;font-family:'Permanent Marker';font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
.sortbar button.on{color:var(--wh);border-color:var(--red)}
.artist{margin-top:26px}
.artist .tape{font-family:'Permanent Marker';font-size:22px;line-height:1;padding:7px 14px 9px}
.artist .known{display:inline-block;font-size:15px;color:var(--dim);margin-left:8px}
.artist .m{font-family:'Permanent Marker';font-size:14px;color:var(--dim);margin:6px 0 2px 4px}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 12px;align-items:center;padding:7px 0 7px 4px;border-bottom:1px solid var(--line)}
.song .t{font-family:'Permanent Marker';font-size:19px;line-height:1.15;color:var(--wh)}
.song .t .n{display:block;font-family:'Patrick Hand';font-size:14px;color:var(--dim)}
.song .life{font-family:'Permanent Marker';font-size:22px;color:var(--wh);min-width:40px;text-align:right}
.song .life.rare{font-family:'Patrick Hand';font-size:13px;color:#555}
.song .tour{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:'Permanent Marker';font-size:16px;color:#444;border:2px solid #333;border-radius:46% 54% 50% 50%/52% 48% 52% 48%}
.song .tour.hot{border-color:var(--red);color:var(--red);border-width:3px}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#000;padding:10px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #222}
.tabs{display:flex;gap:4px;max-width:720px;margin:0 auto}
.tab{flex:1;background:var(--tape);border:0;color:var(--ink);padding:9px 2px;font-family:'Permanent Marker';font-size:15px;cursor:pointer;clip-path:polygon(0 6%,100% 0,98% 100%,2% 94%);opacity:.7}
.tab:nth-child(even){transform:rotate(1.5deg)}.tab:nth-child(odd){transform:rotate(-1.5deg)}
.tab.on{opacity:1;background:var(--red);color:#fff}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--dim);padding:30px 0;font-family:'Permanent Marker';font-size:18px}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header>
  <div class="tape t1">Burn the Setlist</div><br>
  <div class="tape l t2">Brandi Carlile · All Request Tour · Fall 2026</div>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
function tally(n){let h='<div class="tally">';while(n>0){const k=Math.min(n,5);h+=`<span class="g${k===5?' five':''}">${'<i></i>'.repeat(k===5?4:k)}</span>`;n-=k;}return h+'</div>';}
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>different songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing on the sheet yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0];
    h+=`<div class="h2">Most requested</div><div class="sheet"><div class="hd"><span>SETLIST</span><span>${M.done} nights</span></div>
    <div class="one"><div class="win">${one.c} of ${M.done}!</div><div class="t">1. ${esc(one.t)}</div><div class="a">${esc(one.label)} ${tags(one.tags)}</div></div>
    <ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${r.rank}.</div><div class="t">${esc(r.t)}</div>${tally(r.c)}<div class="a">${esc(r.label)} ${tags(r.tags)}</div></li>`).join('')+'</ol></div>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit} / ${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||''}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map((g,i)=>`<div class="artist"><div class="tape${i%2?' l':''}">${esc(g.artist)}</div>${g.known?`<span class="known">known from ${esc(g.known)}</span>`:''}<div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?`, ${g.tot} plays`:''}</div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
const h=location.hash.slice(1); if(h&&document.getElementById(h)) show(h);
})();
</script>
</body>
</html>
