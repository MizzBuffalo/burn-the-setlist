<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 13. Char</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1b1d;--bg2:#141416;--bg3:#26262a;--wh:#f0ede6;--mid:#aaa69e;--dim:#75726b;--em:#d9602c;--em2:#f0905a;--line:#2f2f33;
  --scorch:polygon(0 7%,3% 2%,7% 5%,12% 1%,18% 4%,24% 0,31% 3%,37% 1%,44% 4%,50% 2%,57% 5%,63% 1%,70% 4%,76% 0,83% 3%,89% 1%,95% 4%,100% 2%,99% 12%,97% 22%,100% 33%,98% 45%,100% 57%,97% 68%,99% 80%,97% 91%,100% 100%,0 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--wh);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 96px}
.demo{background:var(--em);color:#1a1a1a;font-family:'Bricolage Grotesque';font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:6px}
.scorch{position:relative;padding:20px 18px 18px}
.scorch::before{content:"";position:absolute;inset:0;clip-path:var(--scorch);background:linear-gradient(135deg,var(--em2),var(--em) 30%,#5a2412 70%,#2a1710);}
.scorch::after{content:"";position:absolute;inset:3px 3px 0 0;clip-path:var(--scorch);background:var(--bg2)}
.scorch>*{position:relative;z-index:1}
header .k{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mid);margin:0 0 6px}
header h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(46px,13.5vw,96px);line-height:.9;margin:0;letter-spacing:-.04em}
header .sub{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--em2);margin:12px 0 0;font-weight:600}
.stats{display:flex;gap:10px;margin:14px 0 0}
.stat{flex:1;padding:10px 0 8px;border-top:2px solid var(--line)}
.stat b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:36px;line-height:1;letter-spacing:-.03em}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.h2{font-family:'Bricolage Grotesque';font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);margin:30px 0 12px}
.one .k{font-family:'Bricolage Grotesque';font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--em2)}
.one .t{font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(36px,11vw,70px);line-height:.92;letter-spacing:-.04em;margin:6px 0 8px}
.one .a{font-size:14px;color:var(--mid)}
.one .n{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;margin-top:10px;letter-spacing:-.02em}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;margin:6px 4px 0 0;background:var(--bg3);color:var(--wh);border-radius:2px}
.tag.bust{background:var(--em);color:#1a1a1a}
.lb{list-style:none;margin:12px 0 0;padding:0}
.lb li{display:grid;grid-template-columns:40px 1fr auto;gap:0 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lb .rk{grid-area:1/1/3/2;font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;color:var(--dim);align-self:start;letter-spacing:-.03em}
.lb .t{grid-area:1/2/2/3;font-family:'Bricolage Grotesque';font-weight:700;font-size:24px;line-height:1.02;letter-spacing:-.03em}
.lb .a{grid-area:2/2/3/3;font-size:12.5px;color:var(--mid);margin-top:4px}
.lb .c{grid-area:1/3/3/4;font-family:'Bricolage Grotesque';font-weight:800;font-size:28px;text-align:right;line-height:1;letter-spacing:-.03em}
.lb .c small{display:block;font-family:'Inter Tight';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
.lb .bar{grid-area:3/2/4/4;height:5px;background:var(--bg3);margin-top:9px}
.lb .bar i{display:block;height:100%;background:linear-gradient(90deg,#4a2012,var(--em) 85%,var(--em2))}
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.alb .nm{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px;letter-spacing:-.02em}
.alb .nm i{font-style:normal;font-family:'Inter Tight';font-size:12px;color:var(--mid);margin-left:6px}
.alb .ct{font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;color:var(--em2)}
.alb .tr{grid-column:1/3;height:5px;background:var(--bg3);margin-top:6px}
.alb .tr i{display:block;height:100%;background:var(--wh)}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);background:var(--bg2);color:var(--wh);font-size:16px;font-family:inherit;margin:0 0 10px;border-radius:2px}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--em)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.sortbar{display:flex;gap:6px}
.sortbar button{border:1px solid var(--line);background:none;color:var(--mid);padding:6px 11px;font-family:'Bricolage Grotesque';font-weight:700;font-size:12px;cursor:pointer;border-radius:2px}
.sortbar button.on{background:var(--wh);border-color:var(--wh);color:#1a1a1a}
.artist{margin-top:26px}
.artist .hd{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;padding:0 0 8px 12px;position:relative;border-bottom:1px solid var(--line)}
.artist .hd::before{content:"";position:absolute;left:0;top:2px;bottom:8px;width:4px;background:linear-gradient(180deg,var(--em2),var(--em) 40%,#3a1a0e)}
.artist .hd b{font-family:'Bricolage Grotesque';font-weight:800;font-size:27px;line-height:1;letter-spacing:-.03em}
.artist .hd small{display:block;font-size:12px;color:var(--em2);margin-top:5px;font-weight:500}
.artist .hd .m{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);text-align:right;white-space:nowrap;line-height:1.4}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:center;padding:10px 0 10px 12px;border-bottom:1px solid var(--line)}
.song .t{font-size:16px;font-weight:500;line-height:1.25}
.song .t .n{display:block;font-size:12px;color:var(--mid);font-weight:400}
.song .life{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;min-width:36px;text-align:right;letter-spacing:-.03em}
.song .life.rare{font-family:'Inter Tight';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.song .tour{min-width:30px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:14px;border:1px solid var(--line);color:var(--dim);border-radius:2px}
.song .tour.hot{background:var(--em);border-color:var(--em);color:#1a1a1a}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--mid);padding:14px 2px;font-family:'Bricolage Grotesque';font-weight:700;font-size:14px;cursor:pointer}
.tab.on{color:var(--em2);box-shadow:inset 0 3px 0 var(--em)}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--mid);padding:30px 0;font-family:'Bricolage Grotesque';font-weight:700;font-size:16px}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header class="scorch">
  <p class="k">Brandi Carlile · All Request Tour</p>
  <h1>Burn the<br>Setlist</h1>
  <p class="sub">Fall 2026 · 15 nights</p>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>diff. songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing to rank yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0], max=one.c;
    h+=`<div class="h2">Most requested</div><div class="one scorch"><div class="k">No. 1</div><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n">${one.c} of ${M.done} nights</div><div>${tags(one.tags)}</div></div>
    <ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${r.rank}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div><div class="bar"><i style="width:${Math.round(r.c/max*100)}%"></i></div></li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit} of ${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="hd"><div><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}</div><div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?`<br>${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
})();
</script>
</body>
</html>
