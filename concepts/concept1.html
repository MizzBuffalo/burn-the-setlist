<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 1. Marquee</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bk:#0a0a0a;--bk2:#161616;--bulb:#ffd23f;--amber:#ff9f1c;--wh:#f6f2e8;--dim:#9a9488;--line:#2a2a2a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bk);color:var(--wh);font-family:'Barlow Semi Condensed',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 96px}
.demo{background:var(--amber);color:#000;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:6px}
.bebas{font-family:'Bebas Neue',sans-serif;font-weight:400}
/* marquee sign */
.sign{position:relative;background:var(--bk2);padding:24px 18px 22px;text-align:center;border:4px solid #3a3a3a;box-shadow:0 0 0 6px var(--bk),0 0 0 8px #3a3a3a}
.sign::before{content:"";position:absolute;inset:6px;pointer-events:none;
  background:
   radial-gradient(circle,var(--bulb) 0 3px,transparent 3.5px) 0 0/16px 16px repeat-x,
   radial-gradient(circle,var(--bulb) 0 3px,transparent 3.5px) 0 100%/16px 16px repeat-x,
   radial-gradient(circle,var(--bulb) 0 3px,transparent 3.5px) 0 0/16px 16px repeat-y,
   radial-gradient(circle,var(--bulb) 0 3px,transparent 3.5px) 100% 0/16px 16px repeat-y;
  filter:drop-shadow(0 0 4px var(--bulb));animation:chase 1s steps(2) infinite}
@keyframes chase{to{background-position:16px 0,16px 100%,0 16px,100% 16px}}
.sign .who{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:0 0 4px}
.sign h1{font-family:'Bebas Neue';font-size:clamp(58px,17vw,120px);line-height:.86;margin:4px 0 6px;color:var(--bulb);text-shadow:0 0 18px rgba(255,210,63,.55),0 0 2px #fff}
.sign .what{font-family:'Bebas Neue';font-size:20px;letter-spacing:.18em;color:var(--wh)}
.stats{display:flex;margin:18px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{flex:1;text-align:center;padding:10px 4px}
.stat b{display:block;font-family:'Bebas Neue';font-size:44px;line-height:1;color:var(--bulb)}
.stat span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.h2{font-family:'Bebas Neue';font-size:22px;letter-spacing:.14em;color:var(--amber);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.h2::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--amber) 0 6px,transparent 6px 12px)}
/* number one */
.one{position:relative;background:var(--bulb);color:#000;padding:22px 18px 18px;margin:0 0 14px;text-align:center;box-shadow:0 0 30px rgba(255,210,63,.35)}
.one::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(0,0,0,.35);pointer-events:none}
.one .np{font-family:'Bebas Neue';font-size:16px;letter-spacing:.3em}
.one .t{font-family:'Bebas Neue';font-size:clamp(40px,12vw,76px);line-height:.9;margin:6px 0 4px}
.one .a{font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em}
.one .n{font-family:'Bebas Neue';font-size:28px;margin-top:8px;letter-spacing:.06em}
.one .tags{margin-top:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;margin:4px 3px 0 0;border:1.5px solid currentColor;border-radius:2px;color:var(--bulb)}
.one .tag{color:#000}
.tag.bust{color:var(--amber)}
.one .tag.bust{background:#000;color:var(--bulb);border-color:#000}
/* countdown */
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lb .rk{font-family:'Bebas Neue';font-size:46px;line-height:.9;color:var(--bulb);text-align:center;grid-area:1/1/3/2;}
.lb .t{grid-area:1/2/2/3;font-family:'Bebas Neue';font-size:26px;line-height:1;letter-spacing:.02em}
.lb .a{grid-area:2/2/3/3;font-size:13px;color:var(--dim);margin-top:3px}
.lb .c{font-family:'Bebas Neue';font-size:30px;color:var(--wh);text-align:right;line-height:1;grid-area:1/3/3/4;}
.lb .c small{display:block;font-family:'Barlow Semi Condensed';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bulbs{grid-area:3/2/4/4;display:flex;gap:5px;margin-top:5px}
.bulbs i{width:11px;height:11px;border-radius:50%;background:#2a2a2a;border:1px solid #3a3a3a}
.bulbs i.on{background:var(--bulb);border-color:var(--bulb);box-shadow:0 0 6px var(--bulb)}
/* scorecard */
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.alb .nm{font-family:'Bebas Neue';font-size:22px;letter-spacing:.02em}
.alb .nm i{font-style:normal;font-family:'Barlow Semi Condensed';font-size:12px;color:var(--dim);margin-left:6px}
.alb .ct{font-family:'Bebas Neue';font-size:22px;color:var(--bulb)}
.alb .tr{grid-column:1/3;height:6px;background:#222;margin-top:4px}
.alb .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--bulb))}
/* covers */
.search{width:100%;padding:13px 14px;border:2px solid #333;background:#111;color:var(--wh);font-size:17px;font-family:inherit;margin:0 0 10px;border-radius:0}
.search:focus{outline:none;border-color:var(--bulb)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.count{font-family:'Bebas Neue';font-size:16px;letter-spacing:.12em;color:var(--dim)}
.sortbar{display:flex;border:1.5px solid #3a3a3a}
.sortbar button{border:0;background:none;color:var(--dim);padding:6px 12px;font-family:'Bebas Neue';font-size:15px;letter-spacing:.1em;cursor:pointer}
.sortbar button.on{background:var(--bulb);color:#000}
.artist{margin-top:22px}
.artist .board{position:relative;background:#1b1b1b;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 7px);padding:10px 12px;border-left:5px solid var(--bulb);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.artist .board b{font-family:'Bebas Neue';font-weight:400;font-size:30px;line-height:.95;letter-spacing:.03em}
.artist .board small{display:block;font-size:12px;color:var(--amber);font-weight:600;letter-spacing:.04em;margin-top:2px}
.artist .board .m{font-family:'Bebas Neue';font-size:15px;letter-spacing:.1em;color:var(--bulb);text-align:right;white-space:nowrap;line-height:1.15}
.song{display:grid;grid-template-columns:1fr auto 34px;gap:0 12px;align-items:center;padding:9px 0 9px 12px;border-bottom:1px solid var(--line)}
.song .t{font-size:17px;font-weight:600;line-height:1.2}
.song .t .n{display:block;font-size:12px;color:var(--dim);font-weight:400}
.song .life{font-family:'Bebas Neue';font-size:24px;color:var(--bulb);min-width:36px;text-align:right}
.song .life.rare{font-family:'Barlow Semi Condensed';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5a554c}
.song .tour{width:30px;height:30px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:17px;color:#444}
.song .tour.hot{background:var(--bulb);border-color:var(--bulb);color:#000;box-shadow:0 0 10px rgba(255,210,63,.6)}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#000;border-top:3px solid var(--bulb);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--dim);padding:10px 2px 12px;font-family:'Bebas Neue';font-size:17px;letter-spacing:.06em;cursor:pointer;position:relative}
.tab::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:#2a2a2a;margin:0 auto 5px}
.tab.on{color:var(--bulb)}
.tab.on::before{background:var(--bulb);box-shadow:0 0 8px var(--bulb)}
section{display:none;padding-top:8px}section.on{display:block}
.empty{text-align:center;color:var(--dim);padding:30px 0;font-family:'Bebas Neue';font-size:22px;letter-spacing:.08em}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header class="sign">
  <p class="who">Brandi Carlile</p>
  <h1>Burn the<br>Setlist</h1>
  <div class="what">All Request Tour · Fall 2026</div>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab, same styling, in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab, same styling, in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab, same styling, in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
const bulbs=c=>`<div class="bulbs">${Array.from({length:M.done},(_,i)=>`<i class="${i<c?'on':''}"></i>`).join('')}</div>`;
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>different songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing on the board yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0];
    h+=`<div class="h2">Top of the chart</div>
    <div class="one"><div class="np">Now playing</div><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n">${one.c} of ${M.done} nights</div><div class="tags">${tags(one.tags)}</div></div>
    <ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${r.rank}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'show':'shows'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div>${bulbs(r.c)}</li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit} of ${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||''}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="board"><div><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}</div><div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?`<br>${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
const h=location.hash.slice(1); if(h&&document.getElementById(h)) show(h);
})();
</script>
</body>
</html>
