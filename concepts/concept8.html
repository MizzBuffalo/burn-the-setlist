<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 8. Charcoal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1d20;--bg2:#17181a;--bg3:#26272b;--wh:#eef0ea;--mid:#aeb3a9;--dim:#767b73;--acc:#9fc2a4;--line:#303237}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--wh);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 96px}
.demo{background:var(--acc);color:#14201a;font-family:'Space Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:6px}
.mono{font-family:'Space Mono',monospace}
header{border:1px solid var(--line);padding:18px 16px 16px;position:relative}
header::before{content:"";position:absolute;left:-1px;top:-1px;width:40px;height:40px;border-top:3px solid var(--acc);border-left:3px solid var(--acc)}
header .k{font-family:'Space Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin:0 0 8px}
header h1{font-family:'Space Grotesk';font-weight:700;font-size:clamp(46px,13vw,90px);line-height:.9;margin:0;letter-spacing:-.04em}
header .sub{font-family:'Space Mono';font-size:12px;color:var(--acc);margin:12px 0 0}
.stats{display:flex;gap:10px;margin:14px 0 0}
.stat{flex:1;border:1px solid var(--line);padding:10px 10px 8px}
.stat b{display:block;font-family:'Space Grotesk';font-weight:700;font-size:36px;line-height:1;letter-spacing:-.03em}
.stat span{font-family:'Space Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}
.h2{font-family:'Space Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:30px 0 12px}
.one{border:2px solid var(--acc);padding:18px 16px 14px;position:relative;margin-bottom:8px}
.one .k{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 8px;font-family:'Space Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.one .t{font-family:'Space Grotesk';font-weight:700;font-size:clamp(32px,9.5vw,60px);line-height:.95;letter-spacing:-.03em}
.one .a{font-family:'Space Mono';font-size:12px;color:var(--mid);margin-top:8px}
.one .n{font-family:'Space Grotesk';font-weight:700;font-size:24px;margin-top:10px;color:var(--acc)}
.tag{display:inline-block;font-family:'Space Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;margin:6px 4px 0 0;border:1px solid var(--line);color:var(--mid);border-radius:3px}
.tag.bust{border-color:var(--acc);color:var(--acc)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:42px 1fr auto;gap:0 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lb .rk{grid-area:1/1/3/2;font-family:'Space Mono';font-weight:700;font-size:16px;color:var(--mid);align-self:start;padding-top:4px}
.lb .t{grid-area:1/2/2/3;font-family:'Space Grotesk';font-weight:700;font-size:22px;line-height:1.05;letter-spacing:-.02em}
.lb .a{grid-area:2/2/3/3;font-family:'Space Mono';font-size:11px;color:var(--mid);margin-top:4px}
.lb .c{grid-area:1/3/3/4;font-family:'Space Grotesk';font-weight:700;font-size:28px;text-align:right;line-height:1;letter-spacing:-.03em}
.lb .c small{display:block;font-family:'Space Mono';font-size:10px;color:var(--mid);text-transform:uppercase}
.lb .bar{grid-area:3/2/4/4;height:4px;background:var(--bg3);margin-top:8px;border-radius:2px}
.lb .bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.alb .nm{font-weight:700;font-size:17px;letter-spacing:-.01em}
.alb .nm i{font-style:normal;font-family:'Space Mono';font-size:11px;color:var(--mid);margin-left:6px}
.alb .ct{font-family:'Space Mono';font-size:13px;color:var(--acc)}
.alb .tr{grid-column:1/3;height:4px;background:var(--bg3);margin-top:6px;border-radius:2px}
.alb .tr i{display:block;height:100%;background:var(--wh);border-radius:2px}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);background:var(--bg2);color:var(--wh);font-size:16px;font-family:inherit;margin:0 0 10px;border-radius:4px}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--acc)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-family:'Space Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}
.sortbar{display:flex;gap:6px}
.sortbar button{border:1px solid var(--line);background:none;color:var(--mid);padding:7px 11px;font-family:'Space Mono';font-size:11px;text-transform:uppercase;cursor:pointer;border-radius:3px}
.sortbar button.on{background:var(--acc);border-color:var(--acc);color:#14201a}
.artist{margin-top:26px}
.artist .hd{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;padding-bottom:8px;border-bottom:2px solid var(--acc)}
.artist .hd b{font-family:'Space Grotesk';font-weight:700;font-size:25px;line-height:1;letter-spacing:-.02em}
.artist .hd small{display:block;font-family:'Space Mono';font-size:11px;color:var(--acc);margin-top:5px}
.artist .hd .m{font-family:'Space Mono';font-size:11px;color:var(--mid);text-transform:uppercase;letter-spacing:.04em;text-align:right;white-space:nowrap;line-height:1.4}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.song .t{font-size:16px;font-weight:500;line-height:1.25}
.song .t .n{display:block;font-family:'Space Mono';font-size:11px;color:var(--mid);font-weight:400}
.song .life{font-family:'Space Grotesk';font-weight:700;font-size:21px;min-width:36px;text-align:right;letter-spacing:-.02em}
.song .life.rare{font-family:'Space Mono';font-size:10px;color:var(--dim);text-transform:uppercase}
.song .tour{min-width:30px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono';font-weight:700;font-size:12px;border:1px solid var(--line);color:var(--dim);border-radius:3px}
.song .tour.hot{background:var(--acc);border-color:var(--acc);color:#14201a}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:4px;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:1px solid transparent;color:var(--mid);padding:10px 2px;font-family:'Space Mono';font-size:11px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;border-radius:4px}
.tab.on{color:var(--acc);border-color:var(--acc)}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--mid);padding:30px 0;font-family:'Space Mono';font-size:13px}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header>
  <p class="k">Brandi Carlile · All Request Tour</p>
  <h1>Burn the Setlist</h1>
  <p class="sub">FALL 2026 / 15 NIGHTS / EVERY SONG SHE COULD PLAY</p>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>diff. songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing to rank yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0], max=one.c;
    h+=`<div class="h2">Most requested</div><div class="one"><div class="k">No. 1</div><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n">${one.c} of ${M.done} nights</div><div>${tags(one.tags)}</div></div>
    <ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${String(r.rank).padStart(2,'0')}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div><div class="bar"><i style="width:${Math.round(r.c/max*100)}%"></i></div></li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit}/${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c?'x'+s.c:'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="hd"><div><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}</div><div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?`<br>${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
})();
</script>
</body>
</html>
