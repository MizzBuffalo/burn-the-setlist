<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 10. Playbill</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121820;--bg2:#0d1218;--bg3:#1a222c;--wh:#f1ecdf;--mid:#b3ad9c;--dim:#7c7869;--acc:#c9a24a;--line:#273040}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--wh);font-family:'Josefin Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px 96px}
.demo{background:var(--acc);color:#1b1a14;font-family:'Josefin Sans';font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px 6px 5px}
header{text-align:center;padding:10px 0 16px;border-bottom:1px solid var(--acc);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:1px;background:var(--acc)}
.rule{display:flex;align-items:center;gap:10px;color:var(--acc);font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}
header .who{font-family:'Playfair Display';font-weight:500;font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin:12px 0 2px;color:var(--mid)}
header h1{font-family:'Playfair Display';font-weight:900;font-size:clamp(46px,13vw,92px);line-height:.95;margin:4px 0 8px;letter-spacing:-.01em}
header h1 em{font-style:italic;font-weight:500;color:var(--acc)}
header .what{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--mid)}
.stats{display:flex;justify-content:center;gap:26px;margin:18px 0 0}
.stat{text-align:center}
.stat b{display:block;font-family:'Playfair Display';font-weight:700;font-size:36px;line-height:1}
.stat span{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.h2{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);margin:32px 0 14px;text-align:center}
.h2::before,.h2::after{content:"";flex:1;height:1px;background:var(--line)}
.one{text-align:center;padding:4px 0 20px;border-bottom:1px solid var(--line)}
.one .rk{font-family:'Playfair Display';font-style:italic;font-size:18px;color:var(--acc)}
.one .t{font-family:'Playfair Display';font-weight:900;font-size:clamp(34px,10vw,66px);line-height:.98;margin:6px 0 8px;letter-spacing:-.01em}
.one .a{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.one .n{display:inline-block;font-family:'Playfair Display';font-weight:700;font-size:22px;margin-top:12px;padding:6px 16px 4px;border:1px solid var(--acc);color:var(--acc)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px 2px;margin:8px 4px 0 0;background:var(--bg3);color:var(--mid)}
.tag.bust{background:var(--acc);color:#1b1a14}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:40px 1fr auto;gap:0 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lb .rk{grid-area:1/1/3/2;font-family:'Playfair Display';font-weight:700;font-size:26px;color:var(--acc);align-self:start}
.lb .t{grid-area:1/2/2/3;font-family:'Playfair Display';font-weight:700;font-size:22px;line-height:1.08}
.lb .a{grid-area:2/2/3/3;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-top:5px}
.lb .c{grid-area:1/3/3/4;font-family:'Playfair Display';font-weight:700;font-size:26px;text-align:right;align-self:start;line-height:1}
.lb .c small{display:block;font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-top:6px}
.lb .bar{grid-area:3/2/4/4;height:2px;background:var(--line);margin-top:10px}
.lb .bar i{display:block;height:100%;background:var(--acc)}
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.alb .nm{font-family:'Playfair Display';font-weight:700;font-size:18px}
.alb .nm i{font-style:italic;font-weight:500;font-size:14px;color:var(--mid);margin-left:6px}
.alb .ct{font-family:'Playfair Display';font-weight:700;font-size:17px;color:var(--acc)}
.alb .tr{grid-column:1/3;height:2px;background:var(--line);margin-top:7px}
.alb .tr i{display:block;height:100%;background:var(--wh)}
.search{width:100%;padding:14px 14px 12px;border:1px solid var(--line);background:var(--bg2);color:var(--wh);font-size:16px;font-family:inherit;margin:0 0 12px;border-radius:0;text-align:center}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--acc)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.sortbar{display:flex;gap:14px}
.sortbar button{border:0;background:none;color:var(--dim);padding:4px 0 2px;font-family:'Josefin Sans';font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-bottom:1px solid transparent}
.sortbar button.on{color:var(--acc);border-color:var(--acc)}
.artist{margin-top:30px}
.artist .hd{text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line);position:relative}
.artist .hd b{display:block;font-family:'Playfair Display';font-weight:700;font-size:27px;line-height:1.05}
.artist .hd small{display:block;font-family:'Playfair Display';font-style:italic;font-weight:500;font-size:14px;color:var(--acc);margin-top:4px}
.artist .hd .m{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);margin-top:6px}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.song .t{font-family:'Playfair Display';font-weight:500;font-size:17px;line-height:1.25}
.song .t .n{display:block;font-family:'Josefin Sans';font-size:12px;color:var(--mid);font-weight:400;margin-top:2px}
.song .life{font-family:'Playfair Display';font-weight:700;font-size:21px;min-width:36px;text-align:right}
.song .life.rare{font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.song .tour{min-width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:700;font-size:14px;border:1px solid var(--line);color:var(--dim);padding-top:1px}
.song .tour.hot{background:var(--acc);border-color:var(--acc);color:#1b1a14}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg2);border-top:1px solid var(--acc);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--mid);padding:15px 2px 12px;font-family:'Josefin Sans';font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.tab.on{color:var(--acc)}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--mid);padding:30px 0;font-family:'Playfair Display';font-style:italic;font-size:18px}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header>
  <div class="rule">Fall 2026</div>
  <div class="who">Brandi Carlile</div>
  <h1>Burn <em>the</em> Setlist</h1>
  <div class="what">The All Request Tour</div>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>different songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing to rank yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0], max=one.c;
    h+=`<div class="h2">Most requested</div><div class="one"><div class="rk">Number one</div><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n">${one.c} of ${M.done} nights</div><div>${tags(one.tags)}</div></div>
    <ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${r.rank}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div><div class="bar"><i style="width:${Math.round(r.c/max*100)}%"></i></div></li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit} of ${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="hd"><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}<div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?` · ${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
})();
</script>
</body>
</html>
