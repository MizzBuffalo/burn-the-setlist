<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 9. Blackout</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--bg2:#141416;--bg3:#1e1e21;--wh:#f5f3ee;--mid:#a9a69f;--dim:#6f6d67;--acc:#b8352f;--line:#242427}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--wh);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 96px}
.demo{background:var(--acc);color:#fff;font-family:Anton;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:6px}
header{text-align:left}
header .k{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mid);margin:0 0 6px}
header h1{font-family:Anton;font-weight:400;font-size:clamp(64px,19vw,130px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:.005em}
header h1 span{color:var(--acc)}
header .sub{font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.stats{display:flex;gap:0;margin:18px 0 0}
.stat{flex:1;padding:8px 0}
.stat b{display:block;font-family:Anton;font-size:44px;line-height:1}
.stat span{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.h2{font-family:Anton;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--mid);margin:34px 0 10px}
.one{padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:4px}
.one .rk{font-family:Anton;font-size:18px;letter-spacing:.2em;color:var(--acc)}
.one .t{font-family:Anton;font-size:clamp(44px,13vw,88px);line-height:.9;text-transform:uppercase;margin:4px 0 8px}
.one .a{font-size:14px;color:var(--mid)}
.one .n{display:inline-block;font-family:Anton;font-size:22px;letter-spacing:.04em;margin-top:12px;padding:4px 12px;background:var(--acc);color:#fff;text-transform:uppercase}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;margin:8px 4px 0 0;border:1px solid var(--dim);color:var(--mid)}
.tag.bust{border-color:var(--acc);color:var(--wh)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:48px 1fr auto;gap:0 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lb .rk{grid-area:1/1/3/2;font-family:Anton;font-size:34px;color:var(--dim);line-height:1}
.lb .t{grid-area:1/2/2/3;font-family:Anton;font-size:26px;line-height:1;text-transform:uppercase}
.lb .a{grid-area:2/2/3/3;font-size:13px;color:var(--mid);margin-top:4px}
.lb .c{grid-area:1/3/3/4;font-family:Anton;font-size:30px;text-align:right;line-height:1}
.lb .c small{display:block;font-family:Barlow;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.lb .bar{grid-area:3/2/4/4;height:3px;background:var(--bg3);margin-top:9px}
.lb .bar i{display:block;height:100%;background:var(--wh)}
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.alb .nm{font-family:Anton;font-size:20px;text-transform:uppercase}
.alb .nm i{font-style:normal;font-family:Barlow;font-size:12px;color:var(--mid);margin-left:6px;text-transform:none}
.alb .ct{font-family:Anton;font-size:18px;color:var(--acc)}
.alb .tr{grid-column:1/3;height:3px;background:var(--bg3);margin-top:6px}
.alb .tr i{display:block;height:100%;background:var(--wh)}
.search{width:100%;padding:13px 0;border:0;border-bottom:2px solid var(--wh);background:none;color:var(--wh);font-size:18px;font-family:inherit;margin:0 0 12px;border-radius:0}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--acc)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.sortbar{display:flex;gap:14px}
.sortbar button{border:0;background:none;color:var(--dim);padding:4px 0;font-family:Anton;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}
.sortbar button.on{color:var(--wh);border-color:var(--acc)}
.artist{margin-top:30px}
.artist .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.artist .hd b{font-family:Anton;font-weight:400;font-size:34px;line-height:.95;text-transform:uppercase}
.artist .hd small{display:block;font-family:Barlow;font-size:12.5px;color:var(--mid);margin-top:4px;text-transform:none}
.artist .hd .m{font-family:Anton;font-size:14px;letter-spacing:.08em;color:var(--acc);text-transform:uppercase;white-space:nowrap;text-align:right;line-height:1.3}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.song .t{font-size:17px;font-weight:500;line-height:1.25}
.song .t .n{display:block;font-size:12px;color:var(--mid);font-weight:400}
.song .life{font-family:Anton;font-size:24px;min-width:36px;text-align:right}
.song .life.rare{font-family:Barlow;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.song .tour{min-width:30px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-family:Anton;font-size:15px;border:1px solid var(--line);color:var(--dim)}
.song .tour.hot{background:var(--wh);border-color:var(--wh);color:#000}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#000;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--dim);padding:14px 2px;font-family:Anton;font-size:16px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab.on{color:var(--wh);box-shadow:inset 0 -3px 0 var(--acc)}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--mid);padding:30px 0;font-family:Anton;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header>
  <p class="k">Brandi Carlile</p>
  <h1>Burn the<br><span>Setlist</span></h1>
  <p class="sub">All Request Tour · Fall 2026</p>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>diff. songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing to rank yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0], max=one.c;
    h+=`<div class="h2">Most requested</div><div class="one"><div class="rk">No. 1</div><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n">${one.c} of ${M.done} nights</div><div>${tags(one.tags)}</div></div>
    <ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${r.rank}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div><div class="bar"><i style="width:${Math.round(r.c/max*100)}%"></i></div></li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit} of ${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="hd"><div><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}</div><div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?`<br>${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
})();
</script>
</body>
</html>
