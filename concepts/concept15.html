<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 15. Matchstick</title>
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1412;--bg2:#15100e;--bg3:#2a1f1b;--bone:#ece2d2;--mid:#b8ab9b;--dim:#7d7267;--em:#e8622f;--em2:#ffb27a;--char:#3b2b25;--line:#332723}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font-family:'Source Sans 3',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 96px}
.demo{background:var(--em);color:#1a100c;font-family:'League Gothic';font-size:15px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:6px}
header .k{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mid);margin:0 0 4px}
header h1{font-family:'League Gothic';font-weight:400;font-size:clamp(76px,23vw,160px);line-height:.84;margin:0;text-transform:uppercase;letter-spacing:.01em}
header h1 span{color:var(--em)}
header .sub{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mid);margin:12px 0 0}
header .sub::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,var(--char) 0 55%,var(--bone) 55%);border-radius:2px;position:relative}
.stats{display:flex;margin:18px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{flex:1;padding:10px 0}
.stat b{display:block;font-family:'League Gothic';font-size:48px;line-height:1}
.stat span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.h2{font-family:'League Gothic';font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--em);margin:30px 0 10px}
.match{position:relative;height:8px;background:var(--bone);border-radius:4px;margin-top:9px}
.match i{position:absolute;left:0;top:0;bottom:0;background:var(--char);border-radius:4px 0 0 4px}
.match i::after{content:"";position:absolute;right:-5px;top:-3px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,var(--em2),var(--em) 45%,rgba(232,98,47,0) 72%);box-shadow:0 0 12px rgba(232,98,47,.7)}
.match i.full{border-radius:4px}
.match i.full::after{right:-4px}
.match i.zero::after{display:none}
.one{padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:4px}
.one .t{font-family:'League Gothic';font-size:clamp(54px,16vw,110px);line-height:.88;text-transform:uppercase}
.one .a{font-size:15px;color:var(--mid);margin-top:8px}
.one .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.one .n{font-family:'League Gothic';font-size:34px;color:var(--em2);letter-spacing:.02em}
.one .n small{font-family:'Source Sans 3';font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-left:6px}
.one .match{height:12px;border-radius:6px;margin-top:12px}
.one .match i{border-radius:6px 0 0 6px}
.one .match i::after{width:18px;height:18px;top:-3px;right:-7px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;margin:6px 4px 0 0;background:var(--bg3);color:var(--bone)}
.tag.bust{background:var(--em);color:#1a100c}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:44px 1fr auto;gap:0 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lb .rk{grid-area:1/1/3/2;font-family:'League Gothic';font-size:40px;color:var(--dim);line-height:1}
.lb .t{grid-area:1/2/2/3;font-family:'League Gothic';font-size:32px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.lb .a{grid-area:2/2/3/3;font-size:13px;color:var(--mid);margin-top:4px}
.lb .c{grid-area:1/3/3/4;font-family:'League Gothic';font-size:36px;text-align:right;line-height:1}
.lb .c small{display:block;font-family:'Source Sans 3';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.lb .match{grid-area:3/2/4/4}
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.alb .nm{font-family:'League Gothic';font-size:24px;text-transform:uppercase}
.alb .nm i{font-style:normal;font-family:'Source Sans 3';font-size:12px;color:var(--mid);margin-left:6px;text-transform:none}
.alb .ct{font-family:'League Gothic';font-size:22px;color:var(--em2)}
.alb .match{grid-column:1/3;margin-top:4px;height:6px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--bg2);color:var(--bone);font-size:17px;font-family:inherit;margin:0 0 10px;border-radius:0}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--em)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.sortbar{display:flex;gap:2px}
.sortbar button{border:1px solid var(--line);background:none;color:var(--mid);padding:5px 12px;font-family:'League Gothic';font-size:17px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.sortbar button.on{background:var(--bone);border-color:var(--bone);color:#1a100c}
.artist{margin-top:26px}
.artist .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--bone)}
.artist .hd b{font-family:'League Gothic';font-weight:400;font-size:38px;line-height:.9;text-transform:uppercase;letter-spacing:.01em}
.artist .hd small{display:block;font-family:'Source Sans 3';font-size:13px;color:var(--em2);margin-top:4px;text-transform:none}
.artist .hd .m{font-family:'League Gothic';font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);white-space:nowrap;text-align:right;line-height:1.15}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.song .t{font-size:17px;font-weight:500;line-height:1.25}
.song .t .n{display:block;font-size:13px;color:var(--mid);font-weight:400}
.song .life{font-family:'League Gothic';font-size:28px;min-width:36px;text-align:right}
.song .life.rare{font-family:'Source Sans 3';font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.song .tour{min-width:30px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-family:'League Gothic';font-size:19px;border:1px solid var(--line);color:var(--dim)}
.song .tour.hot{background:var(--em);border-color:var(--em);color:#1a100c;box-shadow:0 0 10px rgba(232,98,47,.45)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--mid);padding:12px 2px;font-family:'League Gothic';font-size:20px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab.on{color:var(--em2);box-shadow:inset 0 3px 0 var(--em)}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--mid);padding:30px 0;font-family:'League Gothic';font-size:22px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
<header>
  <p class="k">Brandi Carlile · All Request Tour</p>
  <h1>Burn the<br><span>Setlist</span></h1>
  <p class="sub">Fall 2026</p>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
const match=(pct)=>`<div class="match"><i class="${pct>=100?'full':pct<=0?'zero':''}" style="width:${pct}%"></i></div>`;
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>diff. songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing to rank yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0];
    h+=`<div class="h2">Most requested</div><div class="one"><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="row"><div class="n">${one.c} of ${M.done}<small>nights</small></div><div>${tags(one.tags)}</div></div>${match(Math.round(one.c/M.done*100))}</div>
    <ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${r.rank}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div>${match(Math.round(r.c/M.done*100))}</li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit} of ${a.tot}</div>${match(a.pct)}</div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="hd"><div><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}</div><div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?`<br>${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
})();
</script>
</body>
</html>
