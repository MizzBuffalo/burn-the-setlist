<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 14. Soot</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070708;--bg2:#0f0f11;--bg3:#1a1a1d;--wh:#f3f1ec;--mid:#a3a19b;--dim:#66645f;--acc:#c8372d;--line:#1f1f23}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--wh);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.smoke{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:
 radial-gradient(40% 30% at 20% 20%,rgba(255,255,255,.055),transparent 70%),
 radial-gradient(35% 28% at 75% 45%,rgba(255,255,255,.045),transparent 70%),
 radial-gradient(45% 30% at 40% 85%,rgba(255,255,255,.04),transparent 70%);
 animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-5%) scale(1.08)}}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:26px 16px 96px}
.demo{position:relative;z-index:1;background:var(--acc);color:#fff;font-family:Unbounded;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:7px}
header .k{font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--mid);margin:0 0 10px}
header h1{font-family:Unbounded;font-weight:800;font-size:clamp(38px,11.5vw,84px);line-height:.95;margin:0;letter-spacing:-.03em;text-transform:uppercase}
header h1 .s{background:linear-gradient(180deg,var(--wh) 45%,#4a4845 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);margin:14px 0 0}
.stats{display:flex;gap:0;margin:22px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{flex:1;padding:12px 0}
.stat b{display:block;font-family:Unbounded;font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em}
.stat span{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.h2{font-family:Unbounded;font-weight:600;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mid);margin:34px 0 14px}
.one{padding:0 0 20px;border-bottom:1px solid var(--line);margin-bottom:4px}
.one .k{font-family:Unbounded;font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--acc)}
.one .t{font-family:Unbounded;font-weight:800;font-size:clamp(30px,9.5vw,64px);line-height:.98;letter-spacing:-.03em;text-transform:uppercase;margin:8px 0 10px}
.one .a{font-size:13px;color:var(--mid)}
.one .n{font-family:Unbounded;font-weight:600;font-size:18px;margin-top:12px;letter-spacing:-.01em}
.one .n b{color:var(--acc)}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;margin:8px 4px 0 0;border:1px solid var(--dim);color:var(--mid)}
.tag.bust{border-color:var(--acc);color:var(--wh)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:44px 1fr auto;gap:0 10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.lb .rk{grid-area:1/1/3/2;font-family:Unbounded;font-weight:600;font-size:15px;color:var(--dim);align-self:start;padding-top:3px}
.lb .t{grid-area:1/2/2/3;font-family:Unbounded;font-weight:600;font-size:18px;line-height:1.1;letter-spacing:-.02em;text-transform:uppercase}
.lb .a{grid-area:2/2/3/3;font-size:12px;color:var(--mid);margin-top:5px}
.lb .c{grid-area:1/3/3/4;font-family:Unbounded;font-weight:800;font-size:26px;text-align:right;line-height:1;align-self:start}
.lb .c small{display:block;font-family:Inter;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-top:3px}
.lb .bar{grid-area:3/2/4/4;height:2px;background:var(--bg3);margin-top:10px}
.lb .bar i{display:block;height:100%;background:var(--wh)}
.alb{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.alb .nm{font-family:Unbounded;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:-.01em}
.alb .nm i{font-style:normal;font-family:Inter;font-size:11px;color:var(--mid);margin-left:6px;text-transform:none}
.alb .ct{font-family:Unbounded;font-weight:800;font-size:14px;color:var(--acc)}
.alb .tr{grid-column:1/3;height:2px;background:var(--bg3);margin-top:7px}
.alb .tr i{display:block;height:100%;background:var(--wh)}
.search{width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--mid);background:none;color:var(--wh);font-size:17px;font-family:inherit;margin:0 0 12px;border-radius:0}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--wh)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.sortbar{display:flex;gap:14px}
.sortbar button{border:0;background:none;color:var(--dim);padding:4px 0;font-family:Unbounded;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}
.sortbar button.on{color:var(--wh);border-color:var(--acc)}
.artist{margin-top:32px}
.artist .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--wh)}
.artist .hd b{font-family:Unbounded;font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase;letter-spacing:-.02em}
.artist .hd small{display:block;font-family:Inter;font-size:12px;color:var(--mid);margin-top:5px;text-transform:none;font-weight:400}
.artist .hd .m{font-family:Unbounded;font-weight:600;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);white-space:nowrap;text-align:right;line-height:1.6}
.song{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.song .t{font-size:16px;font-weight:500;line-height:1.25}
.song .t .n{display:block;font-size:12px;color:var(--mid);font-weight:400}
.song .life{font-family:Unbounded;font-weight:800;font-size:19px;min-width:36px;text-align:right}
.song .life.rare{font-family:Inter;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.song .tour{min-width:30px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-family:Unbounded;font-weight:600;font-size:12px;border:1px solid var(--line);color:var(--dim)}
.song .tour.hot{background:var(--wh);border-color:var(--wh);color:#000}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#000;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--dim);padding:16px 2px 14px;font-family:Unbounded;font-weight:600;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab.on{color:var(--wh);box-shadow:inset 0 2px 0 var(--acc)}
section{display:none}section.on{display:block}
.empty{text-align:center;color:var(--mid);padding:30px 0;font-family:Unbounded;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="smoke"></div>
<div id="demo"></div>
<div class="wrap">
<header>
  <p class="k">Brandi Carlile</p>
  <h1>Burn the<br><span class="s">Setlist</span></h1>
  <p class="sub">All Request Tour · Fall 2026</p>
</header>
<section id="board" class="on"></section>
<section id="shows"><div class="empty">Setlists tab in the full build.</div></section>
<section id="orig"><div class="empty">Originals tab in the full build.</div></section>
<section id="cov">
  <input class="search" placeholder="Search covers by song or artist">
  <div class="bar2"><div class="count"></div><div class="sortbar"><button class="on" data-s="az">By artist</button><button data-s="most">Most played</button></div></div>
  <div class="list"></div>
</section>
<section id="xmas"><div class="empty">Holiday tab in the full build.</div></section>
</div>
<nav><div class="tabs" id="tabs">
  <button class="tab on" data-t="board">Chart</button><button class="tab" data-t="shows">Setlists</button><button class="tab" data-t="orig">Originals</button><button class="tab" data-t="cov">Covers</button><button class="tab" data-t="xmas">Holiday</button>
</div></nav>
<script src="../data.js"></script>
<script src="_shared.js"></script>
<script>
(function(){
const M=window.M, esc=M.esc;
if(M.DEMO) document.getElementById('demo').innerHTML='<div class="demo">Sample data preview. Three made up setlists added.</div>';
const tags=(arr)=>arr.map(t=>`<span class="tag ${t.cls}">${esc(t.txt)}</span>`).join('');
function board(){
  const el=document.getElementById('board');
  let h=`<div class="stats"><div class="stat"><b>${M.done}</b><span>of ${M.SHOWS.length} shows</span></div><div class="stat"><b>${M.uniq}</b><span>diff. songs</span></div><div class="stat"><b>${M.total}</b><span>songs played</span></div></div>`;
  const lb=M.leaderboard();
  if(!lb.length){ h+=`<div class="empty">Nothing to rank yet. First setlist lands after ${esc(M.nextShow.city)} on ${esc(M.nextShow.date)}.</div>`; }
  else{
    const one=lb[0], max=one.c;
    h+=`<div class="h2">Most requested</div><div class="one"><div class="k">01</div><div class="t">${esc(one.t)}</div><div class="a">${esc(one.label)}</div><div class="n"><b>${one.c}</b> of ${M.done} nights</div><div>${tags(one.tags)}</div></div>
    <ol class="lb">`+lb.slice(1).map(r=>`<li><div class="rk">${String(r.rank).padStart(2,'0')}</div><div class="t">${esc(r.t)}</div><div class="c">${r.c}<small>${r.c===1?'night':'nights'}</small></div><div class="a">${esc(r.label)} ${tags(r.tags)}</div><div class="bar"><i style="width:${Math.round(r.c/max*100)}%"></i></div></li>`).join('')+'</ol>';
  }
  h+=`<div class="h2">Album scorecard</div>`+M.scorecard().map(a=>`<div class="alb"><div class="nm">${esc(a.name)}<i>${a.year}</i></div><div class="ct">${a.hit}/${a.tot}</div><div class="tr"><i style="width:${a.pct}%"></i></div></div>`).join('');
  el.innerHTML=h;
}
let sort='az';
function song(s,sub){
  const life=s.l!=null?`<div class="life">${s.l}</div>`:`<div class="life rare">under 6</div>`;
  return `<div class="song"><div class="t">${esc(s.t)}${sub?`<span class="n">${esc(sub)}</span>`:''}</div>${life}<div class="tour${s.c?' hot':''}">${s.c||'·'}</div></div>`;
}
function covers(){
  const sec=document.getElementById('cov'); const q=sec.querySelector('.search').value;
  let h='';
  if(sort==='most'){ const arr=M.coverFlat(q); sec.querySelector('.count').textContent=arr.length+' songs'; h=arr.map(s=>song(s,s.a)).join(''); }
  else{ const {groups,count}=M.coverGroups(q); sec.querySelector('.count').textContent=count+' songs';
    h=groups.map(g=>`<div class="artist"><div class="hd"><div><b>${esc(g.artist)}</b>${g.known?`<small>known from ${esc(g.known)}</small>`:''}</div><div class="m">${g.songs.length} song${g.songs.length>1?'s':''}${g.tot?`<br>${g.tot} plays`:''}</div></div>${g.songs.map(s=>song(s,s.n)).join('')}</div>`).join(''); }
  sec.querySelector('.list').innerHTML=h||'<div class="empty">No match.</div>';
}
document.querySelector('.search').addEventListener('input',covers);
document.querySelector('.sortbar').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; document.querySelectorAll('.sortbar button').forEach(x=>x.classList.toggle('on',x===b)); covers();});
const tabs=document.getElementById('tabs');
function show(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
board(); covers();
})();
</script>
</body>
</html>
